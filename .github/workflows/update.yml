name: Update Market Brief
on:
  schedule:
    - cron: "30 4,10,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "data/**", "docs/snapshot.pdf"]
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "Update data"
          git pull --rebase
          git push
